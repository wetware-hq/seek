[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "seek"
version = "0.1.0"
description = "Sequence representation frame for synthetic DNA and informational polymers"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/seek"]

[tool.pytest.ini_options]
testpaths = ["tests"]
