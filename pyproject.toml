[project]
name = "seek"
version = "0.1.0"
description = "Sequence representation frame for informational polymers (DNA, RNA, AA, XNA)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
seek-view = "seek.viewer:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["seek*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
